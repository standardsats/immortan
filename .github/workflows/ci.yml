name: Continuous integration
on: push

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: test compile
        run: mvn clean test-compile dependency:build-classpath

      - name: unit tests
        run: mvn test -Dtest=testrunner.UTestRunner
