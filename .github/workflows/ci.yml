name: Continuous integration
on: push

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven
      - name: test compile
        run: mvn clean test-compile dependency:build-classpath -Dmdep.outputFile=cp.txt
      - name: unit tests
        run: java -cp "target/classes:target/test-classes:$(cat cp.txt)" testrunner.UTestRunner
